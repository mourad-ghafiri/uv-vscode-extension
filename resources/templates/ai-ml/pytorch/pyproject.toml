[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "A PyTorch deep learning project"
readme = "README.md"
requires-python = ">={{PYTHON_VERSION}}"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "tensorboard>=2.15.0",
]
