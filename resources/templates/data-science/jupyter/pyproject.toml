[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "A Jupyter notebook project"
readme = "README.md"
requires-python = ">={{PYTHON_VERSION}}"
dependencies = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
]
